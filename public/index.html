<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Prototype</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar"><div class="brand">Agent Prototype</div><div class="badge">Render prototype</div></header>
  <main class="layout">
    <section class="builder panel">
      <div class="panel-head"><h2>Build</h2><span id="status">Idle</span></div>
      <textarea id="prompt" placeholder="Describe what you want to build...\n\nExample: Build a modern Q&A website using Node.js and Express. It should have a search box, question list, answer form, responsive styling, and be fully runnable."></textarea>
      <div class="controls"><select id="provider"><option value="groq">Groq</option><option value="anthropic">Anthropic</option></select><button id="build">Build project</button></div>
      <div class="logs" id="logs"><div class="muted">Agent activity will appear here.</div></div>
    </section>
    <section class="preview panel">
      <div class="panel-head"><h2>Preview</h2><a id="open" href="/preview/" target="_blank" class="open disabled">Open</a></div>
      <div class="frame-wrap"><iframe id="frame" title="Project preview"></iframe><div id="empty" class="empty">Your generated project will appear here.</div></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
